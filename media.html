    <!--
      OMDb POSTER LOADER
    -->

    <script>
      document.addEventListener("DOMContentLoaded", () => {

        /*
         * ==========================================
         * PUT YOUR OMDb API KEY HERE
         * ==========================================
         */
        const API_KEY = "a654b115";


        /*
         * ==========================================
         * SPECIAL SEARCHES
         *
         * These fix entries where the visible title
         * isn't the actual movie title we want.
         * ==========================================
         */
        const specialSearches = {

          "The Marx Brothers": {
            title: "Duck Soup",
            year: "1933"
          },

          "Buster Keaton": {
            title: "The General",
            year: "1926"
          },

          "The Lord of the Rings trilogy": {
            title: "The Lord of the Rings: The Fellowship of the Ring",
            year: "2001"
          },

          "Mr Bean": {
            title: "Bean",
            year: "1997"
          },

          "Star Wars": {
            title: "Star Wars",
            year: "1977"
          },

          "Mission: Impossible": {
            title: "Mission: Impossible",
            year: "1996"
          },

          "A Clockwork Orange": {
            title: "A Clockwork Orange",
            year: "1971"
          },

          "The Godfather Part II": {
            title: "The Godfather Part II",
            year: "1974"
          },

          "Full Metal Jacket": {
            title: "Full Metal Jacket",
            year: "1987"
          },

          "Mulholland Drive": {
            title: "Mulholland Drive",
            year: "2001"
          },

          "Enter the Dragon": {
            title: "Enter the Dragon",
            year: "1973"
          },

          "Dr. Strangelove": {
            title: "Dr. Strangelove",
            year: "1964"
          },

          "Top Gun": {
            title: "Top Gun",
            year: "1986"
          },

          "Casino Royale": {
            title: "Casino Royale",
            year: "2006"
          },

          "The Godfather": {
            title: "The Godfather",
            year: "1972"
          },

          "Closer": {
            title: "Closer",
            year: "2004"
          },

          "Dr. No": {
            title: "Dr. No",
            year: "1962"
          }

        };


        /*
         * ==========================================
         * SMALL RETRY DELAY
         * ==========================================
         */
        const sleep = (ms) =>
          new Promise((resolve) =>
            setTimeout(resolve, ms)
          );


        /*
         * ==========================================
         * OMDb SEARCH
         *
         * Uses "s=" rather than only "t=".
         *
         * OMDb officially supports:
         *
         * s = search
         * t = exact title
         * type = movie / series
         * y = year
         * ==========================================
         */
        async function searchOMDb(
          title,
          type,
          year = "",
          attempt = 1
        ) {

          let url =
            "https://www.omdbapi.com/" +
            `?apikey=${encodeURIComponent(API_KEY)}` +
            `&s=${encodeURIComponent(title)}` +
            `&type=${encodeURIComponent(type)}`;

          if (year) {
            url +=
              `&y=${encodeURIComponent(year)}`;
          }

          try {

            const response =
              await fetch(url);


            /*
             * Retry temporary server / rate-limit
             * failures.
             */
            if (
              response.status === 429 ||
              response.status === 500 ||
              response.status === 502 ||
              response.status === 503 ||
              response.status === 504
            ) {

              if (attempt < 4) {

                await sleep(
                  attempt * 600
                );

                return searchOMDb(
                  title,
                  type,
                  year,
                  attempt + 1
                );
              }

              return null;
            }


            if (!response.ok) {
              return null;
            }


            const data =
              await response.json();


            /*
             * OMDb returns Response: "False"
             * when nothing was found.
             */
            if (
              data.Response !== "True"
            ) {
              return null;
            }


            return data;

          } catch (error) {

            /*
             * Retry network failures.
             */
            if (attempt < 4) {

              await sleep(
                attempt * 600
              );

              return searchOMDb(
                title,
                type,
                year,
                attempt + 1
              );
            }


            console.warn(
              `OMDb request failed for "${title}"`,
              error
            );

            return null;
          }
        }


        /*
         * ==========================================
         * FIND THE BEST RESULT
         * ==========================================
         */
        function findBestResult(
          data,
          wantedTitle
        ) {

          if (
            !data ||
            !data.Search ||
            !Array.isArray(data.Search)
          ) {
            return null;
          }


          /*
           * Remove results that don't have posters.
           */
          const results =
            data.Search.filter(
              (item) =>
                item.Poster &&
                item.Poster !== "N/A"
            );


          if (!results.length) {
            return null;
          }


          const wanted =
            wantedTitle
              .toLowerCase()
              .trim();


          /*
           * Prefer an exact title match.
           */
          const exact =
            results.find(
              (item) =>
                item.Title &&
                item.Title
                  .toLowerCase()
                  .trim() === wanted
            );


          if (exact) {
            return exact;
          }


          /*
           * Otherwise use OMDb's first
           * relevance-ranked result.
           */
          return results[0];
        }


        /*
         * ==========================================
         * LOAD ONE POSTER
         * ==========================================
         */
        async function loadPoster(
          figure,
          type
        ) {

          const displayTitle =
            figure.dataset.title;


          if (!displayTitle) {
            return;
          }


          /*
           * Check whether this movie needs
           * a special search.
           */
          const special =
            specialSearches[
              displayTitle
            ];


          const searchTitle =
            special
              ? special.title
              : displayTitle;


          const searchYear =
            special
              ? special.year
              : "";


          /*
           * First search using our best
           * known title/year.
           */
          let data =
            await searchOMDb(
              searchTitle,
              type,
              searchYear
            );


          let result =
            findBestResult(
              data,
              searchTitle
            );


          /*
           * If the search didn't return anything,
           * try the displayed title without a year.
           */
          if (!result) {

            data =
              await searchOMDb(
                displayTitle,
                type
              );


            result =
              findBestResult(
                data,
                displayTitle
              );
          }


          /*
           * Still nothing?
           * Keep the original fallback text.
           */
          if (
            !result ||
            !result.Poster ||
            result.Poster === "N/A"
          ) {

            console.warn(
              `No poster found for "${displayTitle}"`
            );

            return;
          }


          const frame =
            figure.querySelector(
              ".cover__frame"
            );


          if (!frame) {
            return;
          }


          /*
           * Create the image.
           */
          const img =
            document.createElement("img");


          img.src =
            result.Poster;


          img.alt =
            `${displayTitle} poster`;


          /*
           * Don't wait for scrolling.
           */
          img.loading = "eager";


          img.decoding = "async";


          /*
           * Only remove the text fallback
           * after the image actually loads.
           */
          img.onload = () => {

            const fallback =
              frame.querySelector(
                ".cover__fallback"
              );


            if (fallback) {
              fallback.style.display =
                "none";
            }
          };


          /*
           * If the poster URL itself fails,
           * remove it and preserve the
           * original fallback.
           */
          img.onerror = () => {
            img.remove();
          };


          frame.insertBefore(
            img,
            frame.firstChild
          );
        }


        /*
         * ==========================================
         * FIND FILMS + TV
         * ==========================================
         */

        const grids =
          document.querySelectorAll(
            ".cover-grid"
          );


        if (!grids.length) {
          return;
        }


        const filmFigures =
          grids[0]
            ? [
                ...grids[0].querySelectorAll(
                  ".cover"
                )
              ]
            : [];


        const tvFigures =
          grids[1]
            ? [
                ...grids[1].querySelectorAll(
                  ".cover"
                )
              ]
            : [];


        /*
         * ==========================================
         * LOAD EVERYTHING CONCURRENTLY
         * ==========================================
         *
         * allSettled means:
         *
         * If Star Wars fails,
         * the other 37 still load.
         *
         * If one request is temporarily
         * rate-limited, its own retry handles it.
         */
        Promise.allSettled([

          ...filmFigures.map(
            (figure) =>
              loadPoster(
                figure,
                "movie"
              )
          ),

          ...tvFigures.map(
            (figure) =>
              loadPoster(
                figure,
                "series"
              )
          )

        ]);

      });
    </script>
