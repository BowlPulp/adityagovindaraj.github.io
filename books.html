   <script>
  document.addEventListener("DOMContentLoaded", () => {
    const API_KEY = "AIzaSyDiRoemx4UEqhGW6TLFVZHs8r5SRRMj0Jk";

    const books = [
      ...document.querySelectorAll('.cover[data-kind="book"]')
    ];

    /*
     * Wait helper
     */
    const sleep = (ms) =>
      new Promise((resolve) => setTimeout(resolve, ms));

    /*
     * Search Google Books
     */
    async function searchBooks(query, attempt = 1) {
      const url =
        "https://www.googleapis.com/books/v1/volumes" +
        `?q=${encodeURIComponent(query)}` +
        "&maxResults=10" +
        "&printType=books" +
        `&key=${encodeURIComponent(API_KEY)}`;

      try {
        const response = await fetch(url);

        /*
         * Google rate-limit / temporary server error.
         * Retry automatically.
         */
        if (
          response.status === 429 ||
          response.status === 500 ||
          response.status === 502 ||
          response.status === 503 ||
          response.status === 504
        ) {
          if (attempt < 4) {
            await sleep(attempt * 500);
            return searchBooks(query, attempt + 1);
          }

          return null;
        }

        if (!response.ok) {
          return null;
        }

        return await response.json();

      } catch (error) {
        /*
         * Network failure.
         */
        if (attempt < 4) {
          await sleep(attempt * 500);
          return searchBooks(query, attempt + 1);
        }

        return null;
      }
    }

    /*
     * Find a usable Google Books result.
     */
    function findResult(data, title, author) {
      if (!data?.items?.length) {
        return null;
      }

      const normalizedTitle =
        title.toLowerCase().trim();

      const normalizedAuthor =
        (author || "").toLowerCase().trim();

      /*
       * First prefer an exact-ish title match
       * with a cover.
       */
      const exactTitle = data.items.find((item) => {
        const info = item.volumeInfo;

        if (!info?.imageLinks || !info.title) {
          return false;
        }

        return (
          info.title.toLowerCase().trim() ===
          normalizedTitle
        );
      });

      if (exactTitle) {
        return exactTitle;
      }

      /*
       * Then prefer title + author match.
       */
      if (normalizedAuthor) {
        const authorMatch = data.items.find((item) => {
          const info = item.volumeInfo;

          if (!info?.imageLinks) {
            return false;
          }

          const resultAuthors =
            (info.authors || [])
              .join(" ")
              .toLowerCase();

          return resultAuthors.includes(
            normalizedAuthor
          );
        });

        if (authorMatch) {
          return authorMatch;
        }
      }

      /*
       * Finally accept any result with a cover.
       */
      return data.items.find(
        (item) => item.volumeInfo?.imageLinks
      );
    }

    /*
     * Load one book.
     */
    async function loadBookCover(book) {
      const title = book.dataset.title;
      const author = book.dataset.author;

      if (!title) return;

      /*
       * First attempt:
       * title + author
       */
      let query = `intitle:${title}`;

      if (author) {
        query += ` inauthor:${author}`;
      }

      let data = await searchBooks(query);

      let result =
        findResult(data, title, author);

      /*
       * Second attempt:
       * title only.
       *
       * This helps books such as Bhagavad Gita,
       * where author metadata varies significantly.
       */
      if (!result) {
        data = await searchBooks(
          `intitle:${title}`
        );

        result =
          findResult(data, title, "");
      }

      if (!result) {
        console.warn(
          `No Google Books cover found for "${title}"`
        );
        return;
      }

      const imageLinks =
        result.volumeInfo?.imageLinks;

      if (!imageLinks) return;

      /*
       * Prefer higher-quality images.
       */
      const coverUrl =
        imageLinks.extraLarge ||
        imageLinks.large ||
        imageLinks.medium ||
        imageLinks.small ||
        imageLinks.thumbnail;

      if (!coverUrl) return;

      const frame =
        book.querySelector(".cover__frame");

      if (!frame) return;

      /*
       * Create the image.
       */
      const img =
        document.createElement("img");

      img.src = coverUrl.replace(
        /^http:/,
        "https:"
      );

      img.alt =
        `${title} cover`;

      /*
       * Don't lazy-load these.
       * We want the whole bookshelf to populate.
       */
      img.loading = "eager";
      img.decoding = "async";

      /*
       * Only hide the fallback once
       * the actual image has loaded.
       */
      img.onload = () => {
        const fallback =
          frame.querySelector(
            ".cover__fallback"
          );

        if (fallback) {
          fallback.style.display = "none";
        }
      };

      /*
       * If Google's image URL fails,
       * try the smaller thumbnail.
       */
      img.onerror = () => {
        if (
          imageLinks.thumbnail &&
          img.src !== imageLinks.thumbnail
        ) {
          img.src =
            imageLinks.thumbnail.replace(
              /^http:/,
              "https:"
            );

          return;
        }

        img.remove();
      };

      frame.insertBefore(
        img,
        frame.firstChild
      );
    }

    /*
     * Start ALL books concurrently.
     *
     * allSettled means one failure can never
     * stop the other books from loading.
     */
    Promise.allSettled(
      books.map((book) =>
        loadBookCover(book)
      )
    );
  });
</script>
